<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Changes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0F0E13;
            font-family: -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif;
            color: #F4F2ED;
        }

        .wrap {
            width: 100%;
            padding: 48px 16px;
        }

        .card {
            max-width: 560px;
            margin: 0 auto;
            background: #17151F;
            border: 1px solid #2A2733;
            border-radius: 20px;
            overflow: hidden;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 36px;
            border-bottom: 1px solid #211F2A;
        }

        .brand {
            font-size: 15px;
            font-weight: 600;
            color: #F4F2ED;
            letter-spacing: -0.2px;
        }

        .body-pad {
            padding: 40px 36px 36px 36px;
        }

        h1 {
            font-size: 24px;
            font-weight: 650;
            line-height: 1.3;
            letter-spacing: -0.3px;
            margin: 0 0 12px 0;
            color: #F4F2ED;
        }

        p.lead {
            font-size: 15px;
            line-height: 1.6;
            color: #A7A3B3;
            margin: 0 0 28px 0;
            max-width: 46ch;
        }
        
        .meta {
            font-size: 13px;
            color: #6F6B7C;
            line-height: 1.6;
            border-top: 1px solid #211F2A;
            padding-top: 20px;
        }

        .meta a {
            color: #9C96C4;
            text-decoration: none;
        }

        .foot {
            padding: 22px 36px 30px 36px;
            font-size: 12px;
            color: #57536780;
            text-align: center;
        }

        .foot a {
            color: #57536780;
        }

        .greeting {
            font-size: 15px;
            color: #A7A3B3;
            margin: 0 0 24px 0;
        }

        @media (max-width: 600px) {
            .topbar, .body-pad, .foot {
                padding-left: 22px;
                padding-right: 22px;
            }
            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">

        <div class="topbar">
            <span class="brand">The Whisperer</span>
        </div>

        <div class="body-pad">
            <h1>Your account was changed</h1>

            <p class="greeting">Hi, {UserName} 👋</p>
            
            <p class="meta">
                This link is valid for 1 day and only works on this device — we will never ask for it by phone or email.
                If you didn't request this change, just ignore this email.
            </p>
        </div>

        <div class="foot">
            The Whisperer · 2026
        </div>

    </div>
</div>
</body>
</html>
